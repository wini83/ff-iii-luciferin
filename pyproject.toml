[project]
name = "ff-iii-luciferin"
version = "0.7.0"
description = "A Firefly III enrichment engine that makes your data glow"
authors = [{ name = "wini83", email = "rico.gotti210@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

# --------------------
# Runtime dependencies
# --------------------
dependencies = [
    "aenum>=3.1.16",
    "httpx",
]

# --------------------
# Commitizen
# --------------------
[tool.commitizen]
name = "cz_conventional_commits"
version = "0.7.0"
tag_format = "v$version"
version_files = ["pyproject.toml"]
update_changelog_on_bump = true
annotated_tags = true

# --------------------
# Ruff (lint + format)
# --------------------
[tool.ruff]
line-length = 88
target-version = "py312"

exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "ff_iii_luciferin/openapi",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N"]
ignore = ["N818"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# --------------------
# MyPy
# --------------------
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["build"]

# --------------------
# Build backend
# --------------------
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# --------------------
# Dependency groups (uv)
# --------------------
[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pydantic-settings>=2.12.0",
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "commitizen",
    "python-dotenv",
]

# --------------------
# Setuptools
# --------------------
[tool.setuptools.package-data]
"ff_iii_luciferin" = ["py.typed"]

[tool.setuptools.packages.find]
exclude = ["openapi*"]

# --------------------
# Black (only for legacy / editors)
# --------------------
[tool.black]
line-length = 88
exclude = "ff_iii_luciferin/openapi"
