version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "06:00"
      timezone: "Europe/Warsaw"
    target-branch: "main"
    open-pull-requests-limit: 5

    groups:
      runtime:
        patterns:
          - "aenum"
          - "httpx"
          - "anyio"
        update-types:
          - "minor"
          - "patch"

      tooling:
        patterns:
          - "commitizen"
          - "debugpy"
          - "mypy"
          - "pre-commit"
          - "pydantic*"
          - "pytest*"
          - "python-dotenv"
          - "rich"
          - "ruff"
          - "ty"
        update-types:
          - "minor"
          - "patch"

      other:
        patterns:
          - "*"
        exclude-patterns:
          - "aenum"
          - "httpx"
          - "anyio"
          - "commitizen"
          - "debugpy"
          - "mypy"
          - "pre-commit"
          - "pydantic*"
          - "pytest*"
          - "python-dotenv"
          - "rich"
          - "ruff"
          - "ty"
        update-types:
          - "minor"
          - "patch"

    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: "scope"

    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "06:30"
      timezone: "Europe/Warsaw"
    target-branch: "main"
    open-pull-requests-limit: 3

    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

    commit-message:
      prefix: "ci"
      prefix-development: "ci"
      include: "scope"

    labels:
      - "dependencies"
      - "github-actions"
