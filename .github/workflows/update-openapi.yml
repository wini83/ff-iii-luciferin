name: Update Firefly III OpenAPI client

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-firefly-openapi
  cancel-in-progress: false

jobs:
  update:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: main

      - name: Find and download latest stable specification
        id: update
        run: python scripts/update_openapi.py

      - name: Regenerate OpenAPI models
        if: steps.update.outputs.changed == 'true'
        run: make openapi-gen

      - name: Set up Python
        if: steps.update.outputs.changed == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install uv
        if: steps.update.outputs.changed == 'true'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Verify regenerated client
        if: steps.update.outputs.changed == 'true'
        run: |
          uv sync --dev --locked
          uv run ruff check .
          uv run mypy .
          uv run pytest --cov=ff_iii_luciferin --cov-fail-under=75

      - name: Create pull request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
        with:
          base: main
          branch: automation/update-firefly-openapi
          delete-branch: true
          commit-message: >-
            chore(openapi): update client for Firefly III
            v${{ steps.update.outputs.version }}
          title: >-
            chore(openapi): update client for Firefly III
            v${{ steps.update.outputs.version }}
          body: |
            Automated update from the official Firefly III API documentation.

            - Firefly III: `${{ steps.update.outputs.version }}`
            - API: `v1`
            - OpenAPI Generator: `7.25.0`
