name: Verify OpenAPI 6.7.4 regeneration

on:
  push:
    branches:
      - fix/openapi-674-duplicate-operation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download and regenerate client
        run: |
          python scripts/update_openapi.py
          make openapi-gen
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Verify regenerated client
        run: |
          uv sync --dev --locked
          uv run ruff check .
          uv run mypy .
          uv run pytest --cov=ff_iii_luciferin --cov-fail-under=75
