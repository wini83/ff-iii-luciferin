name: Firefly III E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Firefly on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.15"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install uv
          uv sync --dev --locked

      - name: Start and seed local Firefly III demo
        run: bash scripts/demo/start.sh

      - name: Verify restarting does not duplicate seed data
        run: |
          bash scripts/demo/start.sh | tee /tmp/demo-restart.log
          grep -q '(0 newly created)' /tmp/demo-restart.log

      - name: Run live client test
        run: |
          set -a
          source .firefly-demo/env
          set +a
          echo "::add-mask::$FIREFLY_TOKEN"
          FIREFLY_E2E_URL="$FIREFLY_URL" FIREFLY_E2E_TOKEN="$FIREFLY_TOKEN" \
            uv run pytest -q tests/test_firefly_e2e.py

      - name: Firefly logs on failure
        if: failure()
        run: docker logs --tail 150 ff-iii-luciferin-demo || true

  # Preserve the existing required check name across both E2E versions.
  firefly:
    permissions: {}
    needs: integration
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all E2E checks passed
        env:
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: test "$INTEGRATION_RESULT" = success
