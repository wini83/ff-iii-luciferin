name: Firefly III E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  firefly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install uv
          uv sync --dev

      - name: Start and seed local Firefly III demo
        run: bash scripts/demo/start.sh

      - name: Verify restarting does not duplicate seed data
        run: |
          bash scripts/demo/start.sh | tee /tmp/demo-restart.log
          grep -q '(0 newly created)' /tmp/demo-restart.log

      - name: Run live client test
        run: |
          set -a
          source .firefly-demo/env
          set +a
          echo "::add-mask::$FIREFLY_TOKEN"
          FIREFLY_E2E_URL="$FIREFLY_URL" FIREFLY_E2E_TOKEN="$FIREFLY_TOKEN" \
            uv run pytest -q tests/test_firefly_e2e.py

      - name: Firefly logs on failure
        if: failure()
        run: docker logs --tail 150 ff-iii-luciferin-demo || true
